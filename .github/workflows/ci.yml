name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results

  # Portal + API PHP de verdade (MySQL em container), para a integração não quebrar sem ninguém ver.
  e2e-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AdemarChamiNeto/api-chamados
          path: api-chamados
      - name: Sobe a API com MySQL e dados de exemplo
        run: |
          docker compose -f api-chamados/docker-compose.yml up -d --build --wait
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health && exit 0; sleep 2; done
          docker compose -f api-chamados/docker-compose.yml logs
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:api
      - if: failure()
        run: docker compose -f api-chamados/docker-compose.yml logs api
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-api
          path: test-results
